name: "Build"

on:
  push:
    branches: [ rolling ]
  pull_request:
    branches: [ rolling ]
  schedule:
    # Run once per day to detect broken dependencies
    - cron: '13 6 * * *'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distribution: "humble"
            os: "ubuntu-22.04"
          - ros_distribution: "jazzy"
            os: "ubuntu-24.04"
          - ros_distribution: "kilted"
            os: "ubuntu-24.04"
          - ros_distribution: "rolling"
            os: "ubuntu-24.04"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: ros-tooling/setup-ros@0.7.17
      with:
        required-ros-distributions: ${{ matrix.ros_distribution }}
    - uses : ros-tooling/action-ros-ci@0.4.8
      with:
        package-name: fmilibrary_vendor
        vcs-repo-file-url: ""
        target-ros2-distro: ${{ matrix.ros_distribution }}
